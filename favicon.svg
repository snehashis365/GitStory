<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0F172A"/>
  <!-- Subtle glowing radial background -->
  <circle cx="16" cy="16" r="12" fill="url(#brand-glow)" opacity="0.35"/>
  <!-- Branching Story Stem -->
  <path d="M10 8v16" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 18c3 0 6-2 6-5V8" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 20c4 0 8 1.5 8 4" stroke="#FF5A5F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Milestone Nodes -->
  <circle cx="10" cy="8" r="2.5" fill="#38BDF8"/>
  <circle cx="10" cy="24" r="2.5" fill="#94A3B8"/>
  <circle cx="16" cy="8" r="2.5" fill="#0D9488"/>
  <circle cx="18" cy="24" r="2.5" fill="#FF5A5F"/>
  <!-- Central Sparkle Star -->
  <path d="M24 11l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z" fill="#FF5A5F"/>
  <defs>
    <radialGradient id="brand-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(16 16) rotate(45) scale(16)">
      <stop stop-color="#FF5A5F"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
